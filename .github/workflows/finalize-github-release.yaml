name: 🚀 Finalize GitHub Release
on:
  workflow_dispatch:
    inputs:
      source-run-id:
        description: Tag release workflow run that accepted the Marketplace upload
        required: true
        type: string
      acceptance-artifact-id:
        description: Immutable Marketplace acceptance receipt artifact ID
        required: true
        type: string
      signed-artifact-id:
        description: Signed ZIP artifact ID from that run
        required: true
        type: string
      notes-artifact-id:
        description: Release notes artifact ID from that run
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  finalize:
    name: 🚀 Finalize GitHub Release
    runs-on: ubuntu-26.04
    environment: release
    steps:
      - name: 🔍 Verify the original tag run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source-run-id }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          commit=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" \
            --jq '. | select(.event == "push" and .path == ".github/workflows/release.yaml" and .head_branch == env.TAG) | .head_sha')
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
      - name: 📩 Download Marketplace acceptance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.acceptance-artifact-id }}
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/acceptance
      - name: 📩 Download signed plugin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.signed-artifact-id }}
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}
          path: dist
      - name: 📩 Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.notes-artifact-id }}
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/notes
      - name: 🚀 Publish GitHub release
        uses: tox-dev/github-workflows/publish-github-release@57a765127aae73adf7d0e24a7fe0f067f2d3ea3e # 6.2.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ steps.source.outputs.commit }}
          title: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/notes/release-notes.md
          assets-directory: dist
